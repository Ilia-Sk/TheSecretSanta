server {
    # unprivileged nginx can't open ports below 1024
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # don't reveal the nginx version; uploads up to the backend's 3 MB limit
    server_tokens off;
    client_max_body_size 4m;

    # never serve hidden files (.env, .git, …)
    location ~ /\. {
        deny all;
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        # uploaded files are only ever shown as images
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        proxy_pass http://backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
