spring:
  application:
    name: TheSecretSanta
  config:
    # Local secrets (CLERK_SECRET_KEY=..., MAIL_PASSWORD=...) from a .env file in the
    # project root, so they don't have to be typed on every start. The file is in
    # .gitignore; on a server real environment variables are used instead.
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:23307/secret_santa?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:santa}
    password: ${SPRING_DATASOURCE_PASSWORD:santa_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

app:
  telegram:
    # Anonymous chat bot (optional). Create a bot with @BotFather and put the token in .env:
    # TELEGRAM_BOT_TOKEN=123456:ABC...   TELEGRAM_BOT_USERNAME=MySantaBot
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    polling: ${TELEGRAM_POLLING:true}
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  security:
    jwt-secret: ${JWT_SECRET:change-this-secret-key-change-this-secret-key}
    jwt-expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  clerk:
    # Secret key from the Clerk dashboard → API keys (sk_test_... / sk_live_...). Never commit it.
    secret-key: ${CLERK_SECRET_KEY:}
    api-url: ${CLERK_API_URL:https://api.clerk.com/v1}
    # Comma-separated frontend origins allowed to use session tokens (empty = no check).
    authorized-parties: ${CLERK_AUTHORIZED_PARTIES:}
