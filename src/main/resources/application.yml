spring:
  application:
    name: TheSecretSanta
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:23307/secret_santa?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:santa}
    password: ${SPRING_DATASOURCE_PASSWORD:santa_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  security:
    jwt-secret: ${JWT_SECRET:change-this-secret-key-change-this-secret-key}
    jwt-expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
